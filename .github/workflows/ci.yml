# Continuous integration: every push and pull request must be formatted,
# vetted, buildable and pass the tests under the race detector.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file reads the pinned version from go.mod, so CI and
      # local builds can never drift apart.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race detector)
        run: go test -race -count=1 ./...

      - name: end-to-end HTTP crash and retry gate
        run: go run ./tests/e2e

      # Week 8: the drills and the demo, as quick smoke runs, so neither can
      # silently rot. The full drills (5 kill rounds, 1M-command recovery)
      # produce the evidence in evidence/crash/.
      - name: crash, retry, money and restore drills (quick)
        run: go run ./tests/drills -out drills-ci -crash-rounds 1 -sizes ""

      - name: the three-minute demo
        run: go run ./tests/demo

  # Tests that need a real PostgreSQL. GitHub's Linux runners have Docker, so
  # testcontainers can start one per test package. Kept as a separate job so
  # a Docker hiccup is visibly different from a unit-test failure.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL read-model tests (testcontainers)
        run: go test -tags=integration -count=1 ./internal/projector ./cmd/cexd

  # Known vulnerabilities in the module graph (ADR-0003 rule 5). govulncheck
  # reports only vulnerable code that is actually REACHABLE from our packages,
  # so it fails on real exposure, not on every advisory in go.sum.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # The deployment files must work, not just exist: the image builds with the
  # Dockerfile Compose uses, and Prometheus accepts its config and alert rules.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the cexd image
        run: docker build -f deploy/Dockerfile --build-arg VERSION=${GITHUB_SHA::12} -t cex/cexd:ci .
      - name: the image reports healthy
        run: |
          docker run -d --name cexd -e CEX_API_TOKENS='[]' cex/cexd:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' cexd)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs cexd; exit 1
      - name: promtool checks the Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.5.0
          check config /etc/prometheus/prometheus.yml
