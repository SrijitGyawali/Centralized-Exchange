# Prometheus for the local stack (week 7). It PULLS metrics: every
# scrape_interval it GETs each target's /metrics and stores the samples.
global:
  # 5 s instead of the usual 15 s: load tests last minutes, and a stage of 20 s
  # would otherwise be only one or two points on a graph.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # cexd's PRIVATE admin listener. "cexd" is the Compose service name, which
  # Docker's internal DNS resolves inside the network.
  - job_name: cexd
    static_configs:
      - targets: ["cexd:6060"]

  # Prometheus watches itself too (scrape durations, rule evaluation).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
